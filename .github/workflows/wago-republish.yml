name: Republicar versión en Wago

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Published GitHub release tag to republish on Wago'
        required: true
        type: string
        default: v0.0.5-beta

permissions:
  contents: read

jobs:
  republish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout corrected release notes
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Republish the GitHub release package on Wago
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+[.][0-9]+[.][0-9]+-beta$ ]]
          test -n "$WAGO_API_TOKEN"

          release_json="$RUNNER_TEMP/release.json"
          package_file="$RUNNER_TEMP/release.zip"
          metadata_file="$RUNNER_TEMP/wago-metadata.json"
          response_file="$RUNNER_TEMP/wago-response.txt"
          notes_file="$RUNNER_TEMP/release-notes.md"

          curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" -o "$release_json"

          asset_url=$(jq -er '.assets[] | select(.name | endswith(".zip")) | .browser_download_url' "$release_json" | head -n 1)
          version="$RELEASE_TAG"
          version="${version#v}"
          version="${version%-beta}"
          awk -v target_version="$version" '
            $0 ~ "^## " target_version "([[:space:]]|$)" {
              found=1
              print
              next
            }
            found && /^## [0-9]+[.][0-9]+[.][0-9]+([[:space:]]|$)/ { exit }
            found && /^- (KullThranUI Changelog|Current addon version|Primary source|Secondary source)/ { next }
            found && /^- [0-9]+[.][0-9]+[.][0-9]+ [(][0-9]+-[0-9]+-[0-9]+[)]/ { next }
            found { print }
          ' KullThranUI/CHANGELOG.md > "$notes_file"
          test -s "$notes_file"

          release_body=$(cat "$notes_file")
          jq -n --arg label "KullThranUI_Forever_BETA_${version}" --arg changelog "$release_body" '{label: $label, stability: "beta", changelog: $changelog, supported_forever_patch: "1.60.1"}' > "$metadata_file"

          curl --fail --silent --show-error --location -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/octet-stream' "$asset_url" -o "$package_file"

          metadata=$(cat "$metadata_file")
          curl --fail --silent --show-error -X POST -H "Authorization: Bearer $WAGO_API_TOKEN" -H 'Accept: application/json' --form-string "metadata=$metadata" -F "file=@$package_file" "https://addons.wago.io/api/projects/rNkyW8Ka/version" -o "$response_file"

          response_size=$(wc -c < "$response_file")
          test "$response_size" -gt 0
          echo "Wago accepted the corrected $RELEASE_TAG release (${response_size} response bytes)."